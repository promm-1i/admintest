[build]
  # 프리렌더용 크로미움. 실패해도 빌드를 막지 않는다(prerender.mjs 가 브라우저 없으면 건너뛴다).
  command = "(npx playwright install chromium || true) && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ── 프리미엄 디자인 주소 ──────────────────────────────────────────────
# 실제 파일은 public/<브랜드>/ 에 있고 주소도 /<브랜드>/ 로 그대로 나간다.
# 아래 200 규칙은 맨 밑 SPA catch-all(/* → app.html)이 먼저 삼키지 않도록 막는 용도.
# 301 규칙은 예전 내부 코드명 주소(/templates/corporate-j/ 등)로 이미 나간 링크를
# 새 주소로 넘겨 준다 — 당근·크몽·블로그에 뿌린 링크가 계속 살아 있어야 한다.

[[redirects]]  # 가온소파
  from = "/gaonsofa/*"
  to = "/gaonsofa/:splat"
  status = 200

[[redirects]]
  from = "/lavernoa/*"
  to = "/gaonsofa/:splat"
  status = 301

[[redirects]]
