# 정적 템플릿 샘플(/templates/clinic-* 등)은 SPA catch-all보다 먼저 실제 파일로 서빙
[[redirects]]
  from = "/templates/*"
  to = "/templates/:splat"
  status = 200

# 프리렌더되지 않은 라우트(/samples/:slug 등)의 SPA 폴백.
# index.html 은 홈 프리렌더 결과라 여기에 쓰면 홈 내용이 한 번 스친다. app.html 은
# scripts/prerender.mjs 가 빌드마다 떠 두는 빈 껍데기다.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200
