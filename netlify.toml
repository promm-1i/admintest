[build]
  # 프리렌더용 크로미움. 실패해도 빌드를 막지 않는다(prerender.mjs 가 브라우저 없으면 건너뛴다).
  command = "(npx playwright install chromium || true) && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]  # 말솜씨스피치 — 2026-11-24 내림(원본 제작자 요청), 404
  from = "/malsomssi/*"
  to = "/app.html"
  status = 404
  force = true

[[redirects]]
  from = "/malsomssi"
  to = "/app.html"
  status = 404
  force = true

[[redirects]]
  from = "/malbom/*"
  to = "/app.html"
  status = 404
  force = true

[[redirects]]
  from = "/malbom"
  to = "/app.html"
  status = 404
  force = true

# mooroo 쇼핑몰 프로토타입 — /mooroo 시안 선택 쪽 → /mooroo-1~5 (고객 공유용) — _redirects 와 같은 내용
[[redirects]]
  from = "/mooroo/*"
  to = "/mooroo/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-assets/*"
  to = "/mooroo-assets/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-1/*"
  to = "/mooroo-1/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-2/*"
  to = "/mooroo-2/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-3/*"
  to = "/mooroo-3/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-4/*"
  to = "/mooroo-4/:splat"
  status = 200

[[redirects]]
  from = "/mooroo-5/*"
  to = "/mooroo-5/:splat"
  status = 200

# 마술학원(아티스 크리에이티브) 시안 /magicsample → sample-1~4 — _redirects 와 같은 내용
[[redirects]]
  from = "/magicsample/*"
  to = "/magicsample/:splat"
  status = 200

