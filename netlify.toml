[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 정적 템플릿 샘플(/templates/clinic-* 등)은 SPA catch-all보다 먼저 실제 파일로 서빙
[[redirects]]
  from = "/templates/*"
  to = "/templates/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
