[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# /templates 목록 페이지는 아래 splat 규칙이 빈 splat 으로 삼켜 404 가 되므로 먼저 SPA 로 넘긴다
[[redirects]]
  from = "/templates"
  to = "/index.html"
  status = 200

# 정적 템플릿 샘플(/templates/clinic-* 등)은 SPA catch-all보다 먼저 실제 파일로 서빙
[[redirects]]
  from = "/templates/*"
  to = "/templates/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
