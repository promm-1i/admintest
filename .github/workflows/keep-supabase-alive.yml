name: Keep Supabase project alive

on:
  schedule:
    - cron: "17 3 * * *"   # 매일 1회 03:17 UTC (한국 12:17). 요청 3건.
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (REST x2 + Auth health)
        run: |
          B="https://zedooweakrtfxgrruwoz.supabase.co"
          H1="apikey: ${SUPABASE_ANON_KEY}"; H2="Authorization: Bearer ${SUPABASE_ANON_KEY}"
          curl -sS -o /dev/null -w "reservations: %{http_code}\n" --fail "$B/rest/v1/reservations?select=id&order=created_at.desc&limit=1" -H "$H1" -H "$H2"
          curl -sS -o /dev/null -w "notices: %{http_code}\n" --fail "$B/rest/v1/notices?select=id&order=created_at.desc&limit=3" -H "$H1" -H "$H2"
          curl -sS -o /dev/null -w "auth: %{http_code}\n" --fail "$B/auth/v1/health" -H "$H1"
        env:
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZG9vd2Vha3J0ZnhncnJ1d296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNjM2MzYsImV4cCI6MjEwMTczOTYzNn0.UFfj5CfXcyPnw5Oak0G75MkEKwhgDpnebhx1I8tF_tQ"

      # 24go (이사가요) — separate project.
      # 2026-09-25: 예전엔 Service·Estimate 를 REST 로 읽었는데 anon 역할에 테이블
      # 권한이 없어 매번 401(permission denied)로 끝났다. 그래서 읽기가 성공한 적이
      # 없고 프로젝트는 계속 일시정지 경고를 받았다. 지금은 ops.keepalive 한 줄을
      # 갱신하는 함수(public.ping_keepalive, SECURITY DEFINER)를 부른다 — 실제 쓰기라
      # 활동으로 잡힌다. 함수는 그 한 줄의 시각·횟수만 바꾸므로 anon 에 열어도 된다.
      - name: Ping Supabase — 24go project
        run: |
          B="https://slodhhwxyoqsxgejoqmq.supabase.co"
          H1="apikey: ${SUPABASE_ANON_KEY_24GO}"; H2="Authorization: Bearer ${SUPABASE_ANON_KEY_24GO}"
          curl -sS -w "24go keepalive: %{http_code}\n" --fail -X POST "$B/rest/v1/rpc/ping_keepalive" -H "$H1" -H "$H2" -H "Content-Type: application/json" -d '{}'
          curl -sS -o /dev/null -w "24go auth: %{http_code}\n" --fail "$B/auth/v1/health" -H "$H1"
        env:
          SUPABASE_ANON_KEY_24GO: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNsb2RoaHd4eW9xc3hnZWpvcW1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMTMxNDQsImV4cCI6MjEwMTg4OTE0NH0.TspnPtNmcpC1a4T78q5KBkccwMmML57DnQVytExMcao"
