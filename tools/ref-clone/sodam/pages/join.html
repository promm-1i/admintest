<!--meta {"title":"회원가입","desc":"소담한의원 회원가입 — 약관 동의와 기본 정보를 입력해 가입합니다.","hero":{"type":"flatc","t":"회원가입"}}-->
<div class="wrap bwrap">
  <form class="fwrap" data-demo-form novalidate>
    <div class="fstep"><p class="on"><span>1</span>약관 동의 및 정보 입력</p><p>가입 완료</p></div>
    <h3 class="fh">이용 약관 동의</h3>
    <div class="fbox">
      <div class="agree agree--all"><label><input type="checkbox" data-all>전체 동의</label></div>
      <div class="agree"><label><input type="checkbox" data-agree required>이용약관 동의 (필수)</label><a href="./terms.html">내용 보기</a></div>
      <div class="agree"><label><input type="checkbox" data-agree required>개인정보 수집 · 이용 동의 (필수)</label><a href="./privacy.html">내용 보기</a></div>
      <div class="agree"><label><input type="checkbox" data-agree>마케팅 정보 수신 동의 (선택)</label></div>
    </div>
    <h3 class="fh">개인정보 입력 <small>* 필수 입력</small></h3>
    <div class="fbox">
      <div class="frow"><label class="req" for="uid">아이디</label><div class="finp"><input id="uid" required autocomplete="username" placeholder="영문 · 숫자 6~15자"><button type="button" data-demo>중복 확인</button><p class="fhint">영문 소문자와 숫자를 조합해 주세요.</p></div></div>
      <div class="frow"><label class="req" for="pw">비밀번호</label><div class="finp"><input id="pw" type="password" required autocomplete="new-password" placeholder="비밀번호 입력"><p class="fhint">영문 · 숫자 · 특수문자를 섞어 8~15자로 입력해 주세요.</p></div></div>
      <div class="frow"><label class="req" for="pw2">비밀번호 확인</label><div class="finp"><input id="pw2" type="password" required autocomplete="new-password" placeholder="한 번 더 입력"></div></div>
      <div class="frow"><label class="req" for="nm">이름</label><div class="finp"><input id="nm" required autocomplete="name" placeholder="이름"></div></div>
      <div class="frow"><label class="req" for="tel">휴대폰 번호</label><div class="finp"><input id="tel" type="tel" required autocomplete="tel" placeholder="- 없이 숫자만"></div></div>
      <div class="frow"><label for="em">이메일</label><div class="finp"><input id="em" type="email" autocomplete="email" placeholder="example@email.com"></div></div>
    </div>
    <div class="fbtns"><a class="pbtn pbtn--line" href="./index.html">취소</a><button class="pbtn" type="submit">가입하기</button></div>
  </form>
</div>
