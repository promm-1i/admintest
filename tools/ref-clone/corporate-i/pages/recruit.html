<style>

<script>
// 원본 m74: 직무 카드를 누르면 해당 직무의 담당업무·자격요건을 팝업에 채워 띄운다
var RECRUIT = [{"tit": "펌웨어 설계", "con1": "MCU·MPU·DSP 기반 제어 프로그램 개발<br>장비 조작용 GUI 구현", "con2": "C·C++·C# 개발 경험<br>Serial·SPI 등 통신 인터페이스 사용 경험<br>STEP·DC 모터 제어 경험<br>소프트웨어 신뢰성 시험 경험<br>전자·전기·컴퓨터공학 계열 전공"}, {"tit": "회로설계", "con1": "임베디드·디지털 회로 설계<br>인증·환경 시험과 디버깅", "con2": "OrCAD·PADS 사용 경험<br>PCI 계열 보드 설계 경험<br>방산 개발 문서 작성 경험<br>전자·전기 계열 전공"}, {"tit": "기구설계", "con1": "광학 장비 기구부 설계와 도면 작성<br>시제품 조립·시험 지원", "con2": "3D CAD(SolidWorks 등) 사용 경험<br>공차 해석과 가공 도면 이해<br>기계공학 계열 전공"}, {"tit": "광학설계", "con1": "렌즈·광학계 설계와 성능 해석<br>광학 부품 사양 검토", "con2": "Zemax·Code V 등 설계 툴 사용 경험<br>수차·MTF 해석 이해<br>광학·물리 계열 전공"}, {"tit": "생산기술", "con1": "생산 공정 개선과 설비 관리<br>신규 제품 양산 준비", "con2": "정밀 가공·연마 공정 이해<br>공정 데이터 분석 경험<br>기계·산업공학 계열 전공 우대"}, {"tit": "조립", "con1": "광학 모듈 조립과 정렬<br>조립 공정 기록 관리", "con2": "정밀 조립 경험자 우대<br>클린룸 근무 가능자<br>학력 무관"}, {"tit": "품질 QA", "con1": "품질 시스템 운영과 인증 대응<br>고객 품질 이슈 대응", "con2": "ISO 9001·AS9100 이해<br>품질 문서 작성 경험<br>관련 전공 우대"}, {"tit": "품질 QC", "con1": "입고·공정·출하 검사<br>측정 장비 운용과 검사 기록 관리", "con2": "측정 장비(간섭계 등) 사용 경험 우대<br>검사 성적서 작성 경험<br>학력 무관"}];
$('.m74 ul li a').on('click', function () {
  var d = RECRUIT[+$(this).attr('data-i')];

  $('.recruit1 .info2 dd').html(d.con2);
  $('#dim').show(); $('.lpop.recruit1').show();
});
$('.recruit1 .x2, #dim').on('click', function () { $('#dim').hide(); $('.lpop.recruit1').hide(); });
</script>
