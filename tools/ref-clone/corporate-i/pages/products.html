<style>
.m31List{padding:100px 0 180px}
.m31List .tabs{border-top:1px solid #ddd;box-shadow:0 -1px 0 #ddd inset}
.m31List .tabs ul{display:flex;justify-content:center}
.m31List .tabs ul li{position:relative;margin:0 35px}
.m31List .tabs ul li>a{font-size:19px;color:#888;font-weight:500;line-height:78px;text-align:center}
.m31List .tabs ul li.on>a{color:var(--accent)}
.m31List .tabs ul li.on>a:after{display:block;content:"";width:100%;height:4px;background:var(--accent);position:absolute;left:0;bottom:0}
.m31List .prdExp{padding:140px 0;background:url(./assets/p/m31-exp-bg-l.jpg) no-repeat center;background-size:cover}
.m31List .prdExp>div{display:flex;align-items:center;justify-content:space-between;flex-direction:row-reverse}
.m31List .prdExp>div .imgarea{overflow:hidden;width:560px;border-radius:30px}
.m31List .prdExp>div .imgarea img{display:block}
.m31List .prdExp>div .txtarea{width:560px}
.m31List .prdExp>div .txtarea h4{font-size:54px;color:#000;font-weight:600;line-height:1.3em}
.m31List .prdExp>div .txtarea p{margin-top:30px;font-size:19px;color:#555;line-height:1.7em}
.m31List .prdList{padding:170px 0 0}
.m31List .prdList h5{font-size:38px;color:#000;font-weight:600}
.m31List .prdList ul{display:flex;flex-wrap:wrap;margin:55px 0 0}
.m31List .prdList ul li{width:32%;margin:0 2% 70px 0}
.m31List .prdList ul li:nth-child(3n){margin-right:0}
.m31List .prdList ul li .img{overflow:hidden;border-radius:20px}
.m31List .prdList ul li .img img{display:block;width:100%;transform:scale(1.05);transition:all .6s}
.m31List .prdList ul li:hover .img img{transform:scale(1)}
.m31List .prdList ul li .tit{margin-top:25px;font-size:21px;color:#000;font-weight:600;text-align:center}
@media(max-width:1399px){
  .m31List .tabs ul{overflow-x:auto}
  .m31List .tabs ul li>a{white-space:nowrap}
  .m31List .prdExp>div .imgarea,.m31List .prdExp>div .txtarea{width:48%}
}
@media(max-width:812px){
  .m31List{padding:100px 0 120px}
  .m31List .tabs ul{justify-content:flex-start}
  .m31List .tabs ul li{margin:0 15px}
  .m31List .tabs ul li>a{font-size:16px;line-height:60px}
  .m31List .tabs ul li.on>a:after{height:3px}
  .m31List .prdExp{padding:120px 0}
  .m31List .prdExp>div{flex-direction:column;align-items:stretch;justify-content:flex-start}
  .m31List .prdExp>div .imgarea{width:100%;border-radius:15px}
  .m31List .prdExp>div .imgarea img{width:100%}
  .m31List .prdExp>div .txtarea{width:100%;margin-top:30px}
  .m31List .prdExp>div .txtarea h4{font-size:37px}
  .m31List .prdExp>div .txtarea p{font-size:16px}
  .m31List .prdList{padding:120px 0 0}
  .m31List .prdList ul li,.m31List .prdList ul li:nth-child(3n){width:100%;margin:0 0 30px}
  .m31List .prdList ul li:last-child{margin-bottom:0}
}
</style>
