<style>
.m53 .sec1{padding:100px 0 80px}
.m53 .sec1 .slg{margin-bottom:20px;font-size:54px;color:#000;font-weight:600;line-height:1.3em}
.m53 .sec1 p{margin-bottom:30px;font-size:19px;color:#555;line-height:1.7em}
.m53 .sec1 p:last-child{margin-bottom:0}
.m53 .sec2{padding:160px 0;background:#f9f9f9}
/* 원본은 Swiper 4 기본 CSS 위에 얹혀 있다 — 11 번들의 버튼 기본값(아이콘 글꼴·크기)을 원본 값으로 되돌린다 */
.m53 .swiper-container{margin:0 auto;position:relative;overflow:hidden;z-index:1}
.m53 .swiper-slide img{display:block;width:100%}
.m53 .sec2 .gallery-top{margin-bottom:45px;border-radius:30px}
.m53 .sec2 .gallery-thumbs .swiper-slide{overflow:hidden;position:relative;border-radius:20px;cursor:pointer}
.m53 .sec2 .gallery-thumbs .swiper-slide-thumb-active:after{display:block;content:"";width:100%;height:100%;border:4px solid var(--accent);border-radius:20px;position:absolute;left:0;top:0}
.m53 .sec2 .innerwrap{position:relative}
.m53 .sec2 .innerwrap .swiper-button-prev,.m53 .sec2 .innerwrap .swiper-button-next{position:absolute;top:calc(50% - 45px - 75px);width:64px;height:64px;margin-top:0;border-radius:50%;cursor:pointer;z-index:10;color:transparent}
.m53 .sec2 .innerwrap .swiper-button-prev:after,.m53 .sec2 .innerwrap .swiper-button-next:after{display:none}
.m53 .sec2 .innerwrap .swiper-button-prev{left:-100px;right:auto;background:#e3e3e3 url(./assets/m53-prev.svg) no-repeat center}
.m53 .sec2 .innerwrap .swiper-button-next{right:-100px;left:auto;background:#e3e3e3 url(./assets/m53-next.svg) no-repeat center}
.m53 .sec2 .innerwrap .swiper-button-disabled{opacity:.35;cursor:auto;pointer-events:none}
@media(max-width:1499px){
  .m53 .sec2 .innerwrap .swiper-button-prev,.m53 .sec2 .innerwrap .swiper-button-next{position:static;display:inline-block;margin-top:20px}
}
@media(max-width:812px){
  .m53 .sec1 .slg{font-size:37px}
  .m53 .sec1 p{font-size:16px}
  .m53 .sec2{padding:120px 0}
  .m53 .sec2 .gallery-top{margin-bottom:20px;border-radius:15px}
  .m53 .sec2 .gallery-thumbs .swiper-slide{border-radius:15px}
  .m53 .sec2 .gallery-thumbs .swiper-slide-thumb-active:after{border-width:2px;border-radius:15px}
  .m53 .sec2 .innerwrap .swiper-button-prev,.m53 .sec2 .innerwrap .swiper-button-next{width:40px;height:40px}
}
</style>
<div class="sec1">
  <div class="innerwrap">
    <div class="slg">지역사회와 환경에 좋은 변화를 만들기 위해 <span class="pcbr"></span>계획을 세우고 단계적으로 실천해 나가겠습니다.</div>
    <p>사회의 일원으로서 책임 경영을 실천하고 지속가능한 성장을 이루는 일이 <span class="pcbr"></span>회사와 지역사회 사이의 신뢰를 쌓는 중요한 바탕이라고 생각합니다.</p>
    <p>지역사회와 환경에 좋은 영향을 주기 위해 여러 활동을 펼치고, 이를 체계적으로 운영할 수 있도록 <span class="pcbr"></span>계획을 세워 단계적으로 실천해 나가겠습니다.</p>
  </div>
</div>
<div class="sec2">
  <div class="innerwrap">
    <div class="swiper-container swiper gallery-top"><div class="swiper-wrapper"><div class="swiper-slide"><img src="./assets/p/m53-1.jpg" alt="사회공헌 활동 사진" width="1425" height="949"></div></div></div>
    <div class="swiper-container swiper gallery-thumbs"><div class="swiper-wrapper"><div class="swiper-slide"><img src="./assets/p/m53-1.jpg" alt="" width="1425" height="949"></div></div></div>
    <div class="swiper-button-prev" tabindex="0" role="button" aria-label="이전 사진"></div>
    <div class="swiper-button-next" tabindex="0" role="button" aria-label="다음 사진"></div>
  </div>
</div>
<script>
// 원본 sub.js m53 과 같은 설정. 원본은 Swiper 4 라 breakpoints 가 '이하' 기준(813 이하 2장, 넘으면 4장) — 11 은 '이상' 기준이라 뒤집어 적는다
var galleryThumbs = new Swiper('.m53 .gallery-thumbs', {
  spaceBetween: 20, slidesPerView: 2, loop: false, freeMode: true, watchSlidesProgress: true,
  breakpoints: { 814: { slidesPerView: 4 } }
});
var galleryTop = new Swiper('.m53 .gallery-top', {
  spaceBetween: 20, loop: false, allowTouchMove: false,
  navigation: { nextEl: '.m53 .swiper-button-next', prevEl: '.m53 .swiper-button-prev' },
  thumbs: { swiper: galleryThumbs }
});
</script>
