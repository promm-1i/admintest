<style>
@font-face { font-family: 'Gowun Batang'; src: url('assets/fonts/GowunBatang-Bold.woff2') format('woff2'); font-weight: 700; font-display: swap; }
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-Regular.subset.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-Medium.subset.woff2') format('woff2'); font-weight: 500; font-display: swap; }

/* 3D 벽이 어두워지면 스크립트가 data-tone 을 바꾸고 글자색이 따라 넘어간다 */
@property --fg    { syntax: '<color>'; inherits: true; initial-value: #15191e; }
@property --fg2   { syntax: '<color>'; inherits: true; initial-value: rgba(21, 25, 30, .64); }
@property --scrim { syntax: '<color>'; inherits: true; initial-value: rgba(173, 170, 163, .9); }
:root {
  --bg: #adaaa3;
  --fg: #15191e; --fg2: rgba(21, 25, 30, .64);
  --scrim: rgba(173, 170, 163, .9);
  --lamp: #f2a664;
  --ko: 'Gowun Batang', serif;
  --sans: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --gut: clamp(22px, 4.6vw, 76px);
  --low: clamp(44px, 9vh, 108px);
  --ease: cubic-bezier(.2, .7, .15, 1);
  transition: --fg 1s ease, --fg2 1s ease, --scrim 1s ease;
}
:root[data-tone="dark"] { --fg: #ece8e0; --fg2: rgba(236, 232, 224, .62); --scrim: rgba(9, 12, 20, .88); }
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 400 14px/1.75 var(--sans);
  word-break: keep-all; -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, address { margin: 0; font-weight: inherit; font-style: normal; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 1px solid var(--lamp); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity 2s ease; }
.gl #scene { opacity: 1; }
main, footer { position: relative; z-index: 1; }

.top {
  position: fixed; inset: 0 0 auto; z-index: 5;
  display: flex; justify-content: space-between; align-items: center;
  padding: 26px var(--gut);
}
.mark { font: 700 20px/1 var(--ko); letter-spacing: -0.02em; }
.clock { display: flex; align-items: center; gap: 9px; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--fg2); }
.clock b { width: 5px; height: 5px; border-radius: 50%; background: currentColor; transition: background-color 1s; }
[data-lit="on"] .clock b { background: var(--lamp); }

.hero {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 var(--gut) var(--low);
}
.hero h1 { font: 700 clamp(84px, 11.5vw, 184px)/.9 var(--ko); letter-spacing: -0.04em; }
.hero p { margin-top: 26px; color: var(--fg2); }
@media (prefers-reduced-motion: no-preference) {
  .hero h1, .hero p { animation: rise 1.8s var(--ease) both; animation-delay: 1s; }
  .hero p { animation-delay: 1.25s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }

#collection { height: 420vh; }
#process { height: 460vh; }
#night { height: 340vh; }
.pin { position: sticky; top: 0; height: 100vh; height: 100svh; }
.label { position: absolute; left: var(--gut); bottom: var(--low); width: min(360px, calc(100% - var(--gut) * 2)); display: grid; }
.label > * { grid-area: 1 / 1; align-self: end; opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .9s var(--ease); }
.label > .on { opacity: 1; transform: none; }
.label h3 { font: 700 30px/1.25 var(--ko); letter-spacing: -0.03em; }
.label p { margin-top: 10px; color: var(--fg2); font-variant-numeric: tabular-nums; }
.temp { position: absolute; left: var(--gut); bottom: calc(var(--low) - 30px); color: var(--fg2); font-variant-numeric: tabular-nums; }

.showroom {
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 0 var(--gut) var(--low);
}
.showroom h2 { font: 700 clamp(30px, 3vw, 44px)/1.2 var(--ko); letter-spacing: -0.03em; }
.showroom address { margin-top: 18px; color: var(--fg2); }
.showroom address a { border-bottom: 1px solid transparent; transition: border-color .4s; }
.showroom address a:hover { border-color: currentColor; }

footer { padding: 0 var(--gut) 24px; font-size: 12px; color: var(--fg2); }

@media (max-width: 759px) {
  .top { padding: 18px var(--gut); }
  .hero::before, .pin::before, .showroom::before {
    content: ''; position: absolute; inset: 50% 0 0; pointer-events: none;
    background: linear-gradient(to top, var(--scrim) 55%, transparent);
  }
  .hero, .showroom { position: relative; }
  .hero > *, .showroom > * { position: relative; }
  .hero h1 { font-size: 84px; }
  .label h3 { font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .label > * { transition: none; }
}

<script>
// 글자 쪽: 시계, 장면별 이름, 유리 온도. 3D 가 못 떠도 돈다
(() => {
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a)); return t * t * (3 - 2 * t); };
  const lerp = (a, b, t) => a + (b - a) * t;
  function measure() {
    const m = { vh: innerHeight, max: Math.max(1, document.documentElement.scrollHeight - innerHeight) };
    for (const el of document.querySelectorAll('[data-sec]')) m[el.id] = { top: el.getBoundingClientRect().top + scrollY, h: el.offsetHeight };
    return m;
  }
  const prog = (m, id, y) => clamp((y - m[id].top) / Math.max(1, m[id].h - m.vh));
  // 만드는 과정 진행률 → 유리 온도
  function glassTemp(f) {
    if (f < 0.2) return 1150;
    if (f < 0.4) return 1150 - 100 * smooth(0.2, 0.4, f);
    if (f < 0.6) return 1050 - 150 * smooth(0.4, 0.6, f);
    if (f < 0.7) return 900 - 420 * smooth(0.6, 0.7, f);
    if (f < 0.8) return 480 - 455 * smooth(0.7, 0.8, f);
    return 25;
  }
  window.GAMA = { clamp, smooth, lerp, measure, glassTemp };

  let M = measure(), queued = false;
  const clock = document.querySelector('[data-clock]'), num = document.querySelector('[data-temp]');
  const groups = [['collection', [0.25, 0.51, 0.77]], ['process', [0.2, 0.4, 0.6, 0.8]], ['night', [0.39, 0.72]]]
    .map(([id, cuts]) => ({ id, cuts, items: [...document.querySelectorAll(`#${id} [data-i]`)], i: 0 }));

  function update() {
    queued = false;
    const y = scrollY;
    const min = Math.round(990 + clamp(y / M.max) * 340);   // 16:30 → 22:10
    clock.textContent = `${String(Math.floor(min / 60)).padStart(2, '0')}:${String(min % 60).padStart(2, '0')}`;
    for (const g of groups) {
      const i = g.cuts.filter((c) => prog(M, g.id, y) >= c).length;
      if (i === g.i) continue;
      g.i = i;
      for (const n of g.items) n.classList.toggle('on', +n.dataset.i === i);
    }
    num.textContent = Math.round(glassTemp(prog(M, 'process', y))).toLocaleString('ko-KR');
  }
  const request = () => { if (!queued) { queued = true; requestAnimationFrame(update); } };
  const remeasure = () => { M = measure(); request(); };
  addEventListener('scroll', request, { passive: true });
  addEventListener('resize', remeasure);
  addEventListener('load', remeasure);
  document.fonts && document.fonts.ready.then(remeasure);
  update();
})();
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const { clamp, smooth, lerp, measure, glassTemp } = window.GAMA;
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvas = document.getElementById('scene');
const C = (h) => new THREE.Color(h);
const V = (a) => new THREE.Vector3(...a);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.NeutralToneMapping;
const narrow = () => innerWidth < 760;
const dpr = () => Math.min(devicePixelRatio || 1, narrow() ? 1.5 : 1.75);

const scene = new THREE.Scene();
scene.background = C('#0b0f18');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
pmrem.dispose();
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 600);

/* ---------- 유리 갓: 네 모양과 가마에서 막 떠낸 덩어리를 같은 정점 수로 만들어 서로 바뀌게 한다 ---------- */
const N = 90, SEG = 128, THICK = 0.045;
function sample(ctrl) {
  const curve = new THREE.CatmullRomCurve3(ctrl.map(([x, y]) => new THREE.Vector3(x, y, 0)), false, 'centripetal');
  return curve.getSpacedPoints(N - 1).map((p) => new THREE.Vector2(p.x, p.y));
}
// 안쪽 벽(위→아래) + 바깥 벽(아래→위). 아래 테두리가 이어지고 목은 황동 캡이 덮는다
function shell(outer, thick) {
  const inner = outer.map((p, i) => {
    const a = outer[Math.max(0, i - 1)], b = outer[Math.min(outer.length - 1, i + 1)];
    const tx = b.x - a.x, ty = b.y - a.y, l = Math.hypot(tx, ty) || 1;
    return new THREE.Vector2(Math.max(0.01, p.x + (ty / l) * thick), p.y - (tx / l) * thick);
  });
  return inner.concat(outer.slice().reverse());
}
function dalCtrl() {
  const R = 1.4, a0 = Math.asin(0.2 / R), a1 = Math.PI - Math.asin(0.55 / R), c0 = Math.cos(a0), pts = [];
  for (let i = 0; i <= 16; i++) { const a = lerp(a0, a1, i / 16); pts.push([R * Math.sin(a), -R * (c0 - Math.cos(a))]); }
  return pts;
}
const OUTER = [
  sample(dalCtrl()),
  sample([[0.2, 0], [0.55, -0.08], [0.88, -0.3], [1.06, -0.62], [1.16, -1.05], [1.3, -1.5], [1.5, -1.82], [1.6, -1.95]]),
  sample([[0.2, 0], [0.5, -0.12], [0.7, -0.4], [0.66, -0.75], [0.42, -1.02], [0.4, -1.12], [0.72, -1.42], [0.92, -1.85], [0.86, -2.35], [0.58, -2.68], [0.42, -2.75]]),
  sample([[0.2, 0], [0.55, -0.08], [0.76, -0.28], [0.8, -0.6], [0.8, -2.2], [0.76, -2.55], [0.62, -2.72], [0.5, -2.76]]),
  sample([[0.14, 0], [0.34, -0.1], [0.5, -0.34], [0.56, -0.62], [0.5, -0.9], [0.34, -1.08], [0.14, -1.17], [0.01, -1.19]]),
];
const CENTER_Y = [-1.35, -1.0, -1.4, -1.4];
function lathe(profile, ribs = 0) {
  const g = new THREE.LatheGeometry(profile, SEG);
  if (!ribs) return g;
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const k = 1 + ribs * smooth(-0.3, -0.7, y) * (1 - smooth(-2.35, -2.7, y)) * Math.cos(16 * Math.atan2(x, z));
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  g.computeVertexNormals();
  const n = g.attributes.normal, cols = profile.length;   // 0°·360° 이음매 법선을 맞춘다
  for (let j = 0; j < cols; j++) {
    const a = j, b = SEG * cols + j;
    const x = n.getX(a) + n.getX(b), y = n.getY(a) + n.getY(b), z = n.getZ(a) + n.getZ(b), l = Math.hypot(x, y, z) || 1;
    n.setXYZ(a, x / l, y / l, z / l); n.setXYZ(b, x / l, y / l, z / l);
  }
  return g;
}
const gOuter = OUTER[4];
const glassGeo = lathe(gOuter.map((p) => new THREE.Vector2(Math.max(0.01, p.x * 0.5), p.y * 0.8 - 0.05)).concat(gOuter.slice().reverse()));
const targets = [0, 1, 2, 3].map((i) => lathe(shell(OUTER[i], i === 3 ? THICK * 1.2 : THICK), i === 3 ? 0.035 : 0));
glassGeo.morphAttributes.position = targets.map((g) => g.attributes.position);
glassGeo.morphAttributes.normal = targets.map((g) => g.attributes.normal);

// 벽 그림자용: 모양별 높이→반지름 표 (64단 × 5줄, 0~3 아래)
const PROF = (() => {
  const data = new Uint8Array(64 * 5);
  OUTER.forEach((o, row) => {
    for (let i = 0; i < 64; i++) {
      const y = -(i / 63) * 3;
      let r = 0;
      for (let j = 0; j < o.length - 1; j++) {
        const a = o[j], b = o[j + 1];
        if (a.y >= y && b.y <= y) r = Math.max(r, lerp(a.x, b.x, (a.y - y) / Math.max(1e-6, a.y - b.y)));
      }
      data[row * 64 + i] = Math.round(clamp(r / 2) * 255);
    }
  });
  const t = new THREE.DataTexture(data, 64, 5, THREE.RedFormat, THREE.UnsignedByteType);
  t.magFilter = t.minFilter = THREE.LinearFilter;
  t.unpackAlignment = 1;
  t.needsUpdate = true;
  return t;
})();

/* ---------- 부속 ---------- */
const capGeo = new THREE.CylinderGeometry(0.21, 0.28, 0.42, 48);
const ringGeo = new THREE.TorusGeometry(0.28, 0.02, 8, 48);
const socketGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.34, 24);
const cordGeo = new THREE.CylinderGeometry(1, 1, 60, 12, 1, true);
class Helix extends THREE.Curve {
  getPoint(t, out = new THREE.Vector3()) { const a = t * Math.PI * 7; return out.set(Math.cos(a) * 0.075, 0.15 - t * 0.3, Math.sin(a) * 0.075); }
}
const filGeo = new THREE.TubeGeometry(new Helix(), 160, 0.012, 6);
const brass = new THREE.MeshStandardMaterial({ color: '#b98b4e', metalness: 1, roughness: 0.3 });
const socketMat = new THREE.MeshStandardMaterial({ color: '#2a2521', metalness: 0.6, roughness: 0.5 });
const FABRIC = C('#1d1b19'), STEEL = C('#9ea4aa'), WIRE = C('#3a2c20'), BULB = C('#ffa95e'), WHITE = C('#ffffff');
const HALO = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'), r = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.16, 'rgba(255,255,255,0.5)');
  r.addColorStop(0.5, 'rgba(255,255,255,0.1)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
})();

/* ---------- 유리색 ---------- */
const PAL = [
  { color: C('#ffffff'), att: C('#ffffff'), dist: 40,  em: C('#ffd2a0'), k: 0.12 },  // 투명
  { color: C('#fff1de'), att: C('#d07a26'), dist: 0.9, em: C('#ff9440'), k: 0.2 },   // 호박
  { color: C('#eceef0'), att: C('#555a63'), dist: 1.1, em: C('#ffb877'), k: 0.12 },  // 연기
  { color: C('#e4eaff'), att: C('#2a4bc0'), dist: 0.8, em: C('#7d95ff'), k: 0.14 },  // 코발트
  { color: C('#f6f7e4'), att: C('#7d8a2e'), dist: 1.0, em: C('#e0d67c'), k: 0.18 },  // 올리브
];
const HOT_LO = C('#5a0800'), HOT_MID = C('#ff3d0a'), HOT_HI = C('#ff8a2a');

/* ---------- 조명 8점 ---------- */
const lamps = [];
for (let i = 0; i < 8; i++) {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhysicalMaterial({ transmission: 1, thickness: 0.2, roughness: 0.03, ior: 1.5, specularIntensity: 1, dispersion: narrow() ? 0 : 0.15 });
  // 빛나는 유리는 정면이 밝고 노랗게, 가장자리는 검붉게
  mat.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      float facing = pow(abs(dot(normalize(normal), normalize(vViewPosition))), 1.4);
      totalEmissiveRadiance *= mix(vec3(0.5, 0.2, 0.1), vec3(1.4, 1.22, 1.0), facing);`);
  };
  mat.customProgramCacheKey = () => 'gama-glass';
  const glass = new THREE.Mesh(glassGeo, mat);
  const fitting = new THREE.Group();
  const cap = new THREE.Mesh(capGeo, brass); cap.position.y = 0.13;
  const ring = new THREE.Mesh(ringGeo, brass); ring.position.y = -0.08; ring.rotation.x = Math.PI / 2;
  const socket = new THREE.Mesh(socketGeo, socketMat); socket.position.y = -0.12;
  const filMat = new THREE.MeshBasicMaterial({ color: WIRE.clone() });
  const fil = new THREE.Mesh(filGeo, filMat); fil.position.y = -0.5;
  fitting.add(cap, ring, socket, fil);
  // 불투명 쪽에 그려야 유리가 굴절해서 보여 준다
  const haloMat = new THREE.SpriteMaterial({ map: HALO, color: 0x000000, blending: THREE.AdditiveBlending, transparent: false, depthWrite: false });

/* ---------- 벽: 석회 미장. 창으로 든 햇빛, 그 안에 떨어지는 유리 그림자와 초점 빛, 밤에는 조명마다 번지는 빛 ---------- */

    uSunAmt: { value: 0.55 }, uSoft: { value: 0.06 }, uShear: { value: 0.3 }, uGlowAmt: { value: 0 },

    uniform vec3 uBase, uSun, uGlow, uSunD;

    uniform vec4 uLA[8], uLW[8], uLT[8], uLG[8];

    float windowLight(vec2 p) {

    }`,

/* ---------- 스크롤 기준점. yaw 는 조명을 중심으로 도는 각도 ---------- */

    k('collection', 0.58, c[2], 10.5, -0.16, 0.12, 0.2, 0.14),

const look = new THREE.Vector3(), cam = { d: 10, yaw: 0, sx: 0, sy: 0, n: 0 };
function sampleKeys(y) {
  let i = 0;

  const t = b.y > a.y ? smooth(a.y, b.y, y) : (y >= b.y ? 1 : 0);

let W = 0, H = 0;
function resize() {

const mouse = { x: 0, y: 0, sx: 0, sy: 0 };
if (!reduce) addEventListener('pointermove', (e) => { mouse.x = (e.clientX / innerWidth) * 2 - 1; mouse.y = (e.clientY / innerHeight) * 2 - 1; });

/* ---------- 매 프레임 ---------- */
const damp = (a, b, rate, dt) => lerp(a, b, 1 - Math.exp(-rate * dt));
const S0 = [0, 0, 0, 0], S1 = [0, 0, 0, 0], PS = [0, 0, 0, 0], hot = new THREE.Color(), tmpC = new THREE.Color(), sunD = new THREE.Vector3();

const t0 = performance.now();
let sScroll = scrollY, last = t0, time = 0, tone = '', lit = '';
const shapeInto = (e, out) => { for (let s = 0; s < 4; s++) out[s] = e.shape === -1 ? PS[s] : (e.shape === s ? 1 : 0); };

function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);
  last = now; time += dt;
  const y = scrollY;

  const sy = sScroll;
  sampleKeys(sy);

  const fP = clamp((sy - M.process.top) / Math.max(1, M.process.h - M.vh));
  const heatP = clamp((glassTemp(fP) - 420) / 730);

  // 배치 0 제자리 → 1 한 줄 → 2 세 점 → 3 나선 → 4 쇼룸. 벽은 밤 배치를 위해 뒤로 물러난다
  const nightTop = posOf('night', 0);
  let lay;
  if (sy < nightTop) lay = smooth(posOf('process', 1), nightTop, sy);
  else {
    const f = clamp((sy - nightTop) / Math.max(1, M.night.h - M.vh));
    lay = 1 + smooth(0.33, 0.45, f) + smooth(0.66, 0.78, f) + smooth(posOf('night', 1), posOf('showroom', 0), sy);
  }
  const wallZ = lerp(-7, -24, clamp(lay));
  wall.position.z = wallZ;
  U.uWallZ.value = wallZ;
  const i0 = Math.min(4, Math.floor(lay)), i1 = Math.min(4, i0 + 1), lt = lay - i0;
  const intro = reduce ? 1 : clamp((now - t0 - 200) / 2600);

  for (let k = 0; k < 8; k++) {
    const L = lamps[k], a = STATES[i0][k], b = STATES[i1][k];
    const t = smooth(0, 1, clamp(lt * 1.3 - k * 0.04));
    L.g.position.set(lerp(a.pos[0], b.pos[0], t), lerp(a.pos[1], b.pos[1], t), lerp(a.pos[2], b.pos[2], t));
    if (k === 0) L.g.position.y += Math.pow(1 - intro, 3) * 7;
    if (!reduce) {
      L.g.position.x += Math.sin(time * 0.6 + L.phase) * 0.05;
      L.g.position.z += Math.sin(time * 0.47 + L.phase) * 0.04;
      L.g.rotation.z = Math.sin(time * 0.45 + L.phase) * 0.01;
    }

    const infl = L.glass.morphTargetInfluences;

    const cap = i0 === 0 && isP ? lerp(capP, 1, t) : 1;

    const ca = PAL[a.color], cb = PAL[b.color];

    L.mat.attenuationColor.lerpColors(ca.att, cb.att, t);
    L.mat.attenuationDistance = lerp(ca.dist, cb.dist, t);
    L.em.lerpColors(ca.em, cb.em, t);

    // 달군 유리: 노랑 → 주황 → 검붉게 식다가 투명해진다

    L.mat.emissive.copy(L.em).multiplyScalar(on * lerp(ca.k, cb.k, t)).add(tmpC.copy(hot).multiplyScalar(Math.pow(heat, 1.5) * 0.9));
    L.mat.transmission = 1 - 0.45 * smooth(0.02, 0.35, heat);
    L.mat.roughness = 0.03 + 0.3 * heat;

    L.haloMat.color.copy(BULB).multiplyScalar(on * 1.8).add(tmpC.copy(hot).multiplyScalar(heat * 4.5));
    L.halo.position.y = lerp(-0.5, -0.62, smooth(0, 0.2, heat));
    L.fitting.visible = cap > 0.02;
    L.fitting.position.y = (1 - cap) * 2.5;
    const cs = lerp(0.06, 0.028, cap);
    L.cord.scale.set(cs, 1, cs);
    L.cordMat.color.lerpColors(STEEL, FABRIC, cap);
    L.cordMat.metalness = 1 - cap;
    L.cordMat.roughness = lerp(0.35, 0.85, cap);

    U.uLT.value[k].set(tmpC.r, tmpC.g, tmpC.b, raised * near * (1 - smooth(0, 0.15, heat)));

  const sunT = smooth(0, 0.55, night), moon = smooth(0.58, 0.85, night);
  if (night < 0.5) U.uBase.value.lerpColors(WALL_C[0], WALL_C[1], smooth(0, 0.5, night));
  else U.uBase.value.lerpColors(WALL_C[1], WALL_C[2], smooth(0.5, 1, night));
  U.uSun.value.lerpColors(SUN.day, SUN.dusk, smooth(0.1, 0.55, night)).lerp(SUN.moon, moon);
  U.uSunAmt.value = lerp(lerp(0.55, 0.8, smooth(0, 0.5, night)), 0.12, moon);
  U.uSunD.value.copy(sunD.lerpVectors(SUND[0], SUND[1], sunT)).normalize();
  U.uShear.value = lerp(0.3, 0.95, sunT);
  U.uSoft.value = lerp(lerp(0.06, 0.32, sunT), 0.5, moon);
  U.uGlowAmt.value = smooth(0.35, 0.9, night) * 0.3 + 0.3 * smooth(0.3, 0.5, night) * (1 - smooth(0.6, 0.9, night));
  U.uTime.value = reduce ? 0 : time;
  bloom.strength = lerp(0.6, 0.5, smooth(0.6, 1, night));
  root.style.setProperty('--bg', '#' + U.uBase.value.getHexString());

  // 카메라: 조명을 중심으로 조금씩 돈다. 화면 폭이 좁으면 뒤로 물러나고 조명을 위로 올린다
  mouse.sx = damp(mouse.sx, mouse.x, 2.5, dt); mouse.sy = damp(mouse.sy, mouse.y, 2.5, dt);
  const aspect = W / H, dolly = aspect < 1.1 ? Math.min(2.6, 1.15 / aspect) : 1;
  const yaw = cam.yaw + mouse.sx * 0.06, D = cam.d * dolly;
  camera.position.set(look.x + Math.sin(yaw) * D, look.y + 0.25 - mouse.sy * 0.25 * (cam.d / 8), look.z + Math.cos(yaw) * D);
  camera.lookAt(look);
  if (narrow()) camera.setViewOffset(W, H, 0, cam.sy * H, W, H);
  else camera.setViewOffset(W, H, -cam.sx * W, 0, W, H);

  const nt = night > 0.3 ? 'dark' : 'light';
  if (nt !== tone) root.dataset.tone = tone = nt;
  const nl = night > 0.45 ? 'on' : 'off';
  if (nl !== lit) root.dataset.lit = lit = nl;

  grain.uniforms.uTime.value = reduce ? 0 : time % 10;
  composer.render(dt);
}
root.classList.add('gl');
renderer.setAnimationLoop(frame);
</script>
</body>
