<meta property="og:description" content="담온각은 한옥과 정원에서 한식 다이닝, 웨딩, 연회와 전통문화 프로그램을 운영하는 가상 프리미엄 공간입니다.">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Gothic+A1:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;500;600&family=Raleway:wght@300;400;500;600&family=Song+Myung&display=swap">

<body class="dg-page-map-print dg-page-map-print" tabindex="0">

<div style="text-align:center">
<img alt="" src="./assets/img/map-print.svg"/>
</div>

<script>

(function(){
  const q=(s,r=document)=>r.querySelector(s), qa=(s,r=document)=>[...r.querySelectorAll(s)];
  const body=document.body;
  const popupContainer=q('#dg-i-pp-cont');
  const syncPopupMode=()=>{if(popupContainer)popupContainer.classList.toggle('dg-mo',innerWidth<769);};
  syncPopupMode();addEventListener('resize',syncPopupMode,{passive:true});
  const popupKey=p=>`damongak-popup-${p&&p.id||'item'}`;
  const syncPopupVisibility=()=>{if(!popupContainer)return;const open=qa('article',popupContainer).some(p=>!p.hidden);popupContainer.hidden=!open;};
  if(popupContainer){qa('article',popupContainer).forEach(p=>{try{if(localStorage.getItem(popupKey(p))===new Date().toISOString().slice(0,10))p.hidden=true;}catch(_){}});syncPopupVisibility();}
  const menuButtons=qa('[data-act="menu"]');
  const openMenu=(on)=>{body.classList.toggle('dg-menu-open',on);menuButtons.forEach(b=>b.setAttribute('aria-expanded',String(on)));};
  qa('[data-act="menu"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();openMenu(!body.classList.contains('dg-menu-open'));}));
  qa('[data-act="menu-close"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();openMenu(false);}));
  qa('.dg-gn-nvx-ar>li').forEach(li=>{li.addEventListener('mouseenter',()=>li.classList.add('dg-vrx'));li.addEventListener('mouseleave',()=>li.classList.remove('dg-vrx'));});
  qa('[data-act="submenu"]').forEach(b=>b.addEventListener('click',e=>{if(innerWidth>1199)return;e.preventDefault();const li=b.closest('li'),on=!li.classList.contains('on');qa(':scope>li.on',li.parentElement).forEach(x=>{if(x!==li){x.classList.remove('on');const a=q('[data-act="submenu"]',x);if(a)a.setAttribute('aria-expanded','false');}});li.classList.toggle('on',on);b.setAttribute('aria-expanded',String(on));}));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')openMenu(false);});
  body.classList.add('dg-menu-ready');
  const bindPopupClose=(b,today)=>{const close=()=>{const p=b.closest('article');if(p){p.hidden=true;if(today){try{localStorage.setItem(popupKey(p),new Date().toISOString().slice(0,10));}catch(_){}}}syncPopupVisibility();};b.addEventListener('click',close);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();close();}});};
  qa('[data-act="popup-close"]').forEach(b=>bindPopupClose(b,false));
  qa('[data-act="popup-today"]').forEach(b=>bindPopupClose(b,true));
  qa('[data-act="viewer-close"]').forEach(b=>{const close=()=>{const p=q('#dg-i-pp-rmx-vwrx');if(p){p.classList.remove('dg-fx');p.setAttribute('aria-hidden','true');}body.classList.remove('dg-fx');document.documentElement.classList.remove('dg-fx');};b.addEventListener('click',close);b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();close();}});});
  qa('[data-act="faq"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const li=b.closest('li');const on=!li.classList.contains('on');li.classList.toggle('on',on);b.setAttribute('aria-expanded',String(on));}));
  qa('[data-act="top"]').forEach(b=>b.addEventListener('click',e=>{e.preventDefault();scrollTo({top:0,behavior:'smooth'});}));
  qa('form[data-act="form"]').forEach(f=>f.addEventListener('submit',e=>{e.preventDefault();let bad=false;qa('[required]',f).forEach(x=>{if(!String(x.value||'').trim()){bad=true;x.setAttribute('aria-invalid','true');}else{x.removeAttribute('aria-invalid');}});let m=q('.dg-form-message',f);if(!m){m=document.createElement('p');m.className='dg-form-message';m.setAttribute('role','status');f.appendChild(m);}m.textContent=bad?'필수 입력 항목을 확인해 주세요.':'예시 화면입니다. 실제 접수는 대표전화로 안내해 드립니다.';}));
  const hero=q('[data-dg-slider="hero"]');
  if(hero){const items=qa('.owl-item:not(.cloned)',hero);if(items.length>1){hero.classList.add('dg-simple-slider');let i=Math.min(1,items.length-1),timer;const show=n=>{i=(n+items.length)%items.length;items.forEach((x,k)=>x.classList.toggle('dg-slide-active',k===i));qa('.owl-dot',hero).forEach((x,k)=>x.classList.toggle('active',k===i));const c=q('[data-dg-counter]',hero);if(c)c.textContent=(i+1)+' / '+items.length;};const start=()=>{clearInterval(timer);timer=setInterval(()=>show(i+1),4000);};show(i);start();qa('[data-act="slide-prev"]',hero).forEach(b=>b.addEventListener('click',()=>{show(i-1);start();}));qa('[data-act="slide-next"]',hero).forEach(b=>b.addEventListener('click',()=>{show(i+1);start();}));qa('[data-act="slide-dot"]',hero).forEach(b=>b.addEventListener('click',()=>{show(Number(b.dataset.index)||0);start();}));}}
  qa('.slick-initialized.slick-slider').forEach(slider=>{if(slider.dataset.dgBound)return;slider.dataset.dgBound='1';const track=q('.slick-track',slider),items=track?qa(':scope>.slick-item:not(.slick-cloned)',track):[];if(items.length<2)return;let i=Math.max(0,items.findIndex(x=>x.classList.contains('slick-current'))),offset=1;const first=items[0];if(track&&first){const width=first.getBoundingClientRect().width||parseFloat(first.style.width)||1;try{const matrix=new DOMMatrixReadOnly(getComputedStyle(track).transform);offset=Math.max(0,Math.round(-matrix.m41/width)-i);}catch(_){offset=1;}}const dots=qa('.slick-dots>li',slider);const show=n=>{i=(n+items.length)%items.length;items.forEach((x,k)=>{const on=k===i;x.classList.toggle('slick-current',on);x.classList.toggle('slick-active',on);x.setAttribute('aria-hidden',String(!on));if(on)x.removeAttribute('tabindex');else x.setAttribute('tabindex','-1');});dots.forEach((x,k)=>{const on=k===i;x.classList.toggle('slick-active',on);const b=q('button',x);if(b){b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;}});if(track&&innerWidth>1199){const width=first.getBoundingClientRect().width||parseFloat(first.style.width)||1;track.style.transition='transform .5s ease';track.style.transform=`translate3d(${-(i+offset)*width}px,0,0)`;}};qa('[data-act="slide-prev"]',slider).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();show(i-1);}));qa('[data-act="slide-next"]',slider).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();show(i+1);}));qa('[data-act="slide-dot"]',slider).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();show(Number(b.dataset.index)||0);}));show(i);});
  const gallery=q('#dg-i-blmx-gllx'),galleryItems=qa('[data-act="gallery-open"]');
  if(gallery&&galleryItems.length){let gi=0,timer;const slides=q('.dg-sldx',gallery);const show=n=>{gi=(n+galleryItems.length)%galleryItems.length;const src=q('img',galleryItems[gi]);if(slides&&src)slides.innerHTML=`<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center"><img alt="" src="${src.currentSrc||src.src}" style="max-width:90%;max-height:86%;object-fit:contain"></div>`;gallery.classList.add('dg-blmx-gllx-dspx');gallery.style.display='block';};const close=()=>{clearInterval(timer);gallery.classList.remove('dg-blmx-gllx-dspx','dg-blmx-gllx-plyx');gallery.style.display='none';};galleryItems.forEach((b,k)=>b.addEventListener('click',e=>{e.preventDefault();show(k);}));qa('[data-act="gallery-prev"]',gallery).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();show(gi-1);}));qa('[data-act="gallery-next"]',gallery).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();show(gi+1);}));qa('[data-act="gallery-close"]',gallery).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();close();}));qa('[data-act="gallery-play"]',gallery).forEach(b=>b.addEventListener('click',e=>{e.preventDefault();const on=!gallery.classList.toggle('dg-blmx-gllx-plyx');clearInterval(timer);if(!on)timer=setInterval(()=>show(gi+1),3000);}));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&gallery.style.display!=='none')close();});close();}
})();

</script>
</body>
</html>
