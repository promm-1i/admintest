  $$('[data-faq-cat]').forEach(function(chip){chip.addEventListener('click',function(){var cat=chip.dataset.faqCat;$$('[data-faq-cat]').forEach(function(x){x.classList.toggle('gc-isx-ctvx',x===chip)});$$('[data-faq]').forEach(function(item){var yes=cat==='all'||item.dataset.category===cat;item.style.display=yes?'':'none';if(!yes){item.classList.remove('gc-isx-pnx');var a=$('.gc-ax',item);if(a)a.style.maxHeight='0px'}})})});

  $$('[data-sub-options]').forEach(function(w){var bs=$$('[data-sub-tier]',w);bs.forEach(function(b){b.addEventListener('click',function(){bs.forEach(function(x){var on=x===b;x.classList.toggle('gc-isx-ctvx',on);x.setAttribute('aria-pressed',on?'true':'false')})})})});
  var nav=$('.gc-nchx-tbsx');if(nav){var links=$$('a[href^="#"]',nav), secs=links.map(function(a){return $(a.getAttribute('href'))}).filter(Boolean);function set(id){links.forEach(function(a){a.classList.toggle('gc-isx-ctvx',a.getAttribute('href')==='#'+id)})}function syncEdge(){if(secs[0]&&scrollY<secs[0].offsetTop-180)set(secs[0].id);else if(secs.length&&scrollY+innerHeight>=document.documentElement.scrollHeight-8)set(secs[secs.length-1].id)}links.forEach(function(a){a.addEventListener('click',function(){set(a.hash.slice(1))})});addEventListener('scroll',syncEdge,{passive:true});syncEdge();if('IntersectionObserver'in window){var ob=new IntersectionObserver(function(es){var v=es.filter(function(e){return e.isIntersecting}).sort(function(a,b){return a.boundingClientRect.top-b.boundingClientRect.top});if(v[0])set(v[0].target.id);else syncEdge()},{rootMargin:'-40% 0px -55% 0px',threshold:0});secs.forEach(function(s){ob.observe(s)})}}
