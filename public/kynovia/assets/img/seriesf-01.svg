<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-label="선반 사이를 오가며 팔레트를 들어 올리는 지게차형 로봇 도식">
  <rect width="1280" height="460" fill="#fff"/>
  <defs>
    <g id="bay">
      <rect x="0" y="0" width="200" height="34" rx="4" fill="#e7ebee"/>
      <rect x="-8" y="34" width="216" height="5" fill="#d3d9dd"/>
    </g>
  </defs>
  <g>
    <use href="#bay" x="60" y="60"/><use href="#bay" x="300" y="60"/>
    <use href="#bay" x="60" y="150"/><use href="#bay" x="300" y="150"/>
    <use href="#bay" x="60" y="240"/><use href="#bay" x="300" y="240"/>
    <use href="#bay" x="60" y="330"/><use href="#bay" x="300" y="330"/>
    <use href="#bay" x="1000" y="150"/><use href="#bay" x="1000" y="240"/><use href="#bay" x="1000" y="330"/>
    <rect x="1000" y="345" width="200" height="0" fill="none"/>
  </g>
  <rect x="0" y="418" width="1280" height="3" fill="#eef1f3"/>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
      values="20 0; 20 0; 560 0; 560 0; 840 0; 840 0; 560 0; 20 0"
      keyTimes="0; .12; .32; .42; .6; .72; .86; 1" calcMode="spline"
      keySplines=".45 0 .55 1; .45 0 .55 1; .45 0 .55 1; .45 0 .55 1; .45 0 .55 1; .45 0 .55 1; .45 0 .55 1"/>
    <rect x="40" y="96" width="14" height="318" rx="3" fill="#b9c2c8"/>
    <rect x="58" y="110" width="8" height="304" rx="2" fill="#cfd6db"/>
    <rect x="22" y="300" width="58" height="104" rx="8" fill="#eceff1" stroke="#25292c" stroke-width="5"/>
    <rect x="30" y="316" width="40" height="10" rx="3" fill="#3a9bd5"/>
    <circle cx="50" cy="96" r="9" fill="#25292c"/>
    <rect x="22" y="404" width="58" height="12" rx="4" fill="#25292c"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0; 0 -210; 0 -210; 0 0; 0 0; 0 -120; 0 -120; 0 0; 0 0"
        keyTimes="0; .08; .12; .2; .42; .5; .6; .68; 1"/>
      <rect x="66" y="396" width="12" height="20" fill="#25292c"/>
      <rect x="66" y="408" width="150" height="8" rx="2" fill="#25292c"/>
    </g>
  </g>
</svg>
