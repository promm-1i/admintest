<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-label="세로 기둥을 오르내리며 상자를 꺼내는 수직형 로봇 도식">
  <rect width="1280" height="460" fill="#fff"/>
  <defs>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#e9edf0" stroke-width="2"/>
    </pattern>
    <g id="tote">
      <rect x="0" y="0" width="58" height="30" rx="4" fill="#fff" stroke="#d3d9dd" stroke-width="3"/>
      <path d="M 8 9 H 50" stroke="#e1e6e9" stroke-width="3"/>
    </g>
  </defs>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <use href="#tote" x="80" y="414"/><use href="#tote" x="300" y="414"/><use href="#tote" x="560" y="414"/>
  <g>
    <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
      values="0 0; 0 0; -110 0; -110 0; -40 0; -40 0; 0 0"
      keyTimes="0; .2; .35; .6; .72; .9; 1"/>
    <rect x="1106" y="22" width="16" height="408" rx="3" fill="#b9c2c8"/>
    <rect x="1126" y="34" width="8" height="396" rx="2" fill="#cfd6db"/>
    <rect x="1090" y="430" width="70" height="12" rx="4" fill="#25292c"/>
    <circle cx="1100" cy="446" r="7" fill="#25292c"/><circle cx="1150" cy="446" r="7" fill="#25292c"/>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="10s" repeatCount="indefinite"
        values="0 0; 0 140; 0 140; 0 330; 0 330; 0 60; 0 0"
        keyTimes="0; .15; .25; .45; .55; .85; 1" calcMode="spline"
        keySplines=".4 0 .6 1; 0 0 1 1; .4 0 .6 1; 0 0 1 1; .4 0 .6 1; .4 0 .6 1"/>
      <rect x="1036" y="30" width="72" height="34" rx="5" fill="#25292c"/>
      <rect x="1048" y="38" width="30" height="10" rx="2" fill="#fff"/>
      <rect x="1060" y="64" width="44" height="8" fill="#25292c"/>
    </g>
  </g>
</svg>
