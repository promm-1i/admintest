<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-label="격자 위를 대각선으로 오가는 두 대의 판형 로봇 도식">
  <rect width="1280" height="460" fill="#fff"/>
  <defs>
    <pattern id="xgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#e7ebee" stroke-width="2"/>
    </pattern>
    <g id="xbot">
      <rect x="-38" y="-34" width="76" height="68" rx="6" fill="#55595d" stroke="#2a2e31" stroke-width="5"/>
      <rect x="-30" y="-8" width="60" height="16" rx="3" fill="#2a2e31"/>
      <rect x="-38" y="-38" width="76" height="8" rx="3" fill="#2a2e31"/>
      <rect x="-38" y="30" width="76" height="8" rx="3" fill="#2a2e31"/>
    </g>
  </defs>
  <rect width="1280" height="460" fill="url(#xgrid)"/>
  <g><use href="#xbot"/>
    <animateMotion dur="10s" repeatCount="indefinite" path="M 40 40 L 360 120 L 680 200 L 1000 280 L 1240 360 L 680 200 L 40 40"
      keyTimes="0;.18;.36;.54;.7;.85;1" keyPoints="0;.13;.27;.4;.5;.75;1" calcMode="linear"/></g>
  <g><use href="#xbot"/>
    <animateMotion dur="10s" repeatCount="indefinite" path="M 280 400 L 40 300 L 640 140 L 840 280 L 1040 280 L 1160 420 L 280 400"
      keyTimes="0;.15;.35;.5;.62;.75;1" keyPoints="0;.08;.3;.39;.46;.53;1" calcMode="linear"/></g>
</svg>
