<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" role="img" aria-label="곡선 길을 따라 이동하는 두 대의 이동로봇 도식">
  <rect width="1280" height="460" fill="#fff"/>
  <defs>
    <g id="bot">
      <rect x="-58" y="-34" width="116" height="68" rx="30" fill="#24282b" stroke="#c9d0d5" stroke-width="5"/>
      <rect x="-40" y="-20" width="80" height="40" rx="16" fill="#3a3f43"/>
      <rect x="-50" y="-40" width="26" height="10" rx="4" fill="#6c757b"/>
      <rect x="24" y="-40" width="26" height="10" rx="4" fill="#6c757b"/>
      <rect x="-50" y="30" width="26" height="10" rx="4" fill="#6c757b"/>
      <rect x="24" y="30" width="26" height="10" rx="4" fill="#6c757b"/>
    </g>
  </defs>
  <rect x="40" y="18" width="130" height="56" rx="14" fill="#e6eaed"/>
  <rect x="1030" y="44" width="62" height="118" rx="28" fill="#e6eaed"/>
  <rect x="1104" y="44" width="62" height="118" rx="28" fill="#e6eaed"/>
  <rect x="60" y="410" width="140" height="40" rx="10" fill="#e6eaed"/>
