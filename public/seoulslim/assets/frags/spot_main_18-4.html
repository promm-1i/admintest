<script>

    function initStoreSwiper(panel) {
        if (!panel) return;
        const container = panel.querySelector('.swiper-container');
        const paging = panel.querySelector('.paging');
        const slides = container?.querySelectorAll('.swiper-slide') || [];

        if (slides.length <= 1) {
            paging && (paging.style.display = 'none');
            return;
        }else {
            paging && (paging.style.display = '');
        }

        if (panel._swiper) {
            panel._swiper.update();
            panel._swiper.autoplay && panel._swiper.autoplay.start();
            return;
        }

        panel._swiper = new Swiper(container, {
            slidesPerView: 1,
            loop: true,
            autoplay: {delay: 5000, disableOnInteraction: false},
            pagination: {el: paging, clickable: true, type: 'bullets'},
            observer: true,
            observeParents: true
        });
    }

    function showTab(targetSel) {
        const panels = document.querySelectorAll('.store_slide');
        const target = document.querySelector(targetSel);
        panels.forEach(p => p.classList.toggle('is-active', p === target));
        requestAnimationFrame(() => initStoreSwiper(target));
    }

    document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-target]');
        if (!btn) return;
        showTab(btn.dataset.target);
    });

    initStoreSwiper(document.querySelector('.store_slide.is-active') || document.querySelector('.store_slide'));
